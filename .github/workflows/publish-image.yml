name: Runtime Publish RC Image

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag (e.g. 0.1.0-rc.1)'
        required: true
        default: '0.1.0-rc.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: onestao/wechat-hub-runtime

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate requested RC tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          rc='${{ inputs.rc_tag }}'
          if ! printf '%s\n' "$rc" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "Invalid RC tag: $rc" >&2
            exit 1
          fi

      - name: Run runtime regression suite
        run: sudo -E python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile-check shell entry points
        run: |
          bash -n root/scripts/wechat/wechat-runtime
          bash -n root/scripts/wechat/wechat-display-lock.sh
          bash -n root/custom-cont-init.d/50-wechat-account-bootstrap
          bash -n root/custom-services.d/wechat-runtime-control
          bash -n root/custom-services.d/wechat-desktop-gateway

  publish:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            release_tag='${{ inputs.rc_tag }}'
          else
            release_tag='${{ github.ref_name }}'
            release_tag="${release_tag#v}"
          fi
          target="${REGISTRY}/${IMAGE_NAME}:${release_tag}"
          if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable release tag: $target" >&2
            exit 1
          fi
          echo "Release tag is unused: $target"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.rc_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output digest
        run: |
          echo "## Runtime RC Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
