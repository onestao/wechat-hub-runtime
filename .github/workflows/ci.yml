name: Runtime CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run runtime tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile-check shell entry points
        run: |
          bash -n root/scripts/wechat/wechat-runtime
          bash -n root/scripts/wechat/wechat-display-lock.sh
          bash -n root/custom-cont-init.d/50-wechat-account-bootstrap
          bash -n root/custom-services.d/wechat-runtime-control
          bash -n root/custom-services.d/wechat-desktop-gateway

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Build image (no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ghcr.io/onestao/wechat-hub-runtime:ci
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
