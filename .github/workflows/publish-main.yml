name: Publish main image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/onestao/wechat-hub-runtime

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: sudo -E python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check shell entry points
        run: |
          bash -n root/scripts/wechat/wechat-runtime
          bash -n root/scripts/wechat/wechat-display-lock.sh
          bash -n root/custom-cont-init.d/50-wechat-account-bootstrap
          bash -n root/custom-services.d/wechat-runtime-control
          bash -n root/custom-services.d/wechat-desktop-gateway

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            INSTALL_QQ=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: \`linux/amd64, linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
